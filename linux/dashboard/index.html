<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JengaDev</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --ink:#e6edf3; --muted:#9198a1; --accent:#4aa8f5; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1rem; margin:0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:20px; }
  .panel h2 { margin:0 0 14px; font-size:0.95rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .svc-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .svc-row:last-child { border-bottom:none; }
  .svc-name { font-weight:600; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; background:var(--muted); }
  .dot.running { background:var(--ok); }
  .dot.stopped { background:var(--muted); }
  button { background:var(--accent); color:#06121f; border:none; padding:6px 14px; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.85rem; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:var(--bad); color:#fff; }
  input[type=text] { background:var(--bg); border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:6px; font-size:0.9rem; }
  .hosts-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .hosts-row:last-child { border-bottom:none; }
  .host-domain { font-weight:600; }
  .host-domain a { color:var(--accent); text-decoration:none; }
  .create-row { display:flex; gap:10px; margin-top:14px; }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--line); padding:12px 18px; border-radius:8px; font-size:0.9rem; display:none; }
  .toast.show { display:block; }
  .toast.error { border-color:var(--bad); color:var(--bad); }
  select { background:var(--bg); border:1px solid var(--line); color:var(--ink); padding:6px 10px; border-radius:6px; }
  .quicklinks a { color:var(--accent); text-decoration:none; margin-right:16px; font-size:0.85rem; }
</style>
</head>
<body>
  <header>
    <h1>🧱 JengaDev</h1>
    <div class="quicklinks">
      <a href="http://127.0.0.1:8025" target="_blank">Mailpit</a>
      <a href="http://127.0.0.1:8081" target="_blank">Adminer</a>
    </div>
  </header>

  <div class="wrap">
    <div class="panel">
      <h2>Services</h2>
      <div id="services"></div>
    </div>

    <div class="panel">
      <h2>PHP version</h2>
      <select id="php-select">
        <option value="php81">PHP 8.1</option>
        <option value="php82">PHP 8.2</option>
        <option value="php83">PHP 8.3</option>
      </select>
      <button onclick="switchPhp()">Switch</button>
    </div>

    <div class="panel">
      <h2>Hosts</h2>
      <div id="hosts"></div>
      <div class="create-row">
        <input type="text" id="new-host-name" placeholder="myproject (becomes myproject.localhost)">
        <button onclick="createHost()">Create</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
