name: jengadev

# The JengaDev daemon itself is NOT a service here - it runs directly on the
# host (a single Linux binary, same pkg-compiled approach as the Windows
# build) and controls everything below by shelling out to `docker compose`.
# Running the daemon as a container too ("Docker outside of Docker", with
# the socket bind-mounted) was the first draft, but every volume path below
# is resolved by the Docker Engine on the HOST - a containerized daemon
# would need its own filesystem view translated back to host paths for
# every bind mount, purely to save requiring Node on the host. Simpler and
# more consistent with how the Windows daemon already works: just run it
# on the host directly.

services:
  caddy:
    image: caddy:2-alpine
    container_name: jengadev_caddy
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./www:/var/www
      - ./config/ssl:/etc/caddy/ssl:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/jengadev

  # PHP 8.1 used to be offered here too. Dropped: it's vulnerable to
  # CVE-2026-109618/CVE-2026-109619 (PHP2Shell, an unauthenticated RCE pair,
  # CVSS 9.2) and upstream PHP has stated 8.1 will never get a backported
  # fix - there's no patched base image to rebuild this against. Existing
  # php81 projects need to move to php82 or php83.
  # Rebuild+push the remaining images with: docker build --build-arg
  # PHP_VERSION=8.2 -t ghcr.io/mtaalamtech/jengadev-php:8.2 ./php (and 8.3)
  php82:
    image: ghcr.io/mtaalamtech/jengadev-php:8.2
    container_name: jengadev_php82
    restart: unless-stopped
    profiles: ["services"]
    volumes:
      - ./www:/var/www
      - ./logs/php:/var/log/jengadev-php
      - ./config/php_error_router.php:/etc/jengadev/php_error_router.php:ro
      - ./config/php-error-router.ini:/usr/local/etc/php/conf.d/99-jengadev.ini:ro

  php83:
    image: ghcr.io/mtaalamtech/jengadev-php:8.3
    container_name: jengadev_php83
    restart: unless-stopped
    profiles: ["services"]
    volumes:
      - ./www:/var/www
      - ./logs/php:/var/log/jengadev-php
      - ./config/php_error_router.php:/etc/jengadev/php_error_router.php:ro
      - ./config/php-error-router.ini:/usr/local/etc/php/conf.d/99-jengadev.ini:ro

  mariadb:
    image: mariadb:11
    container_name: jengadev_mariadb
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mysql-custom.cnf:/etc/mysql/conf.d/99-jengadev.cnf:ro

  postgres:
    image: postgres:16
    container_name: jengadev_postgres
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env on first run}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: jengadev_mailpit
    restart: unless-stopped
    profiles: ["services"]
    environment:
      # Confirmed against the real image: these bind to the same-named CLI
      # flags via viper's env support, not documented in --help since
      # there's no entrypoint script doing the translation. An empty auth
      # file (the default - see mailpit_auth.txt below) is treated as "no
      # auth required", confirmed the same way, so this is safe to always
      # pass rather than only when the dashboard has configured credentials.
      - MP_SMTP_AUTH_FILE=/etc/jengadev/mailpit_auth.txt
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    ports:
      # The host-side ports are configurable (MAILPIT_SMTP_PORT/
      # MAILPIT_WEB_PORT in .env, written by the daemon) - the container's
      # own internal bind addresses stay fixed at Mailpit's defaults
      # (8025/1025), since MP_LISTEN/MP_SMTP do NOT rebind those the way
      # MP_SMTP_AUTH_FILE does (confirmed directly - setting them had no
      # effect), so only the published mapping changes, not the internal
      # listen address. The web UI is exposed on every interface, same
      # reasoning as the daemon's own dashboard - it's iframed from the
      # dashboard, which is deliberately LAN-reachable for headless
      # servers, so a loopback-only bind here would just break that iframe
      # for every remote viewer. The SMTP port stays loopback-only -
      # nothing needs to relay mail into this box from elsewhere on the
      # LAN, only the PHP containers do (over the internal Docker network,
      # not this port).
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - ./config/mailpit_auth.txt:/etc/jengadev/mailpit_auth.txt:ro

  adminer:
    image: adminer:latest
    container_name: jengadev_adminer
    restart: unless-stopped
    profiles: ["services"]
    ports:
      # Same reasoning as Mailpit's 8025 above - iframed from the LAN-
      # reachable dashboard, so it needs to be LAN-reachable too. Adminer
      # itself still requires real DB credentials to connect to anything,
      # so this doesn't widen access to the databases - just to the login
      # form.
      - "8081:8080"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jengadev_phpmyadmin
    restart: unless-stopped
    profiles: ["services"]
    environment:
      - PMA_HOST=mariadb
      - PMA_PORT=3306
    ports:
      - "8082:80"

volumes:
  mariadb_data:
  postgres_data:
  caddy_data:
  caddy_config:
